<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentraOS - Smart Operations & Security Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-shield-alt"></i> SentraOS
            </span>
            <span class="navbar-text">
                <span id="current-time"></span>
            </span>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stat-card bg-primary text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="fas fa-microchip"></i> CPU Usage</h6>
                        <h3 id="cpu-stat">0%</h3>
                        <small>Current utilization</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-success text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="fas fa-memory"></i> Memory</h6>
                        <h3 id="memory-stat">0%</h3>
                        <small>RAM usage</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-warning text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="fas fa-hdd"></i> Disk Usage</h6>
                        <h3 id="disk-stat">0%</h3>
                        <small>Storage used</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-danger text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="fas fa-exclamation-triangle"></i> Alerts</h6>
                        <h3 id="alert-count">0</h3>
                        <small>Active alerts</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-chart-line"></i> CPU & Memory Usage
                    </div>
                    <div class="card-body">
                        <canvas id="systemChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-network-wired"></i> Network Traffic
                    </div>
                    <div class="card-body">
                        <canvas id="networkChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Security & Alerts Row -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-shield-alt"></i> Security Scans</span>
                        <button class="btn btn-sm btn-primary" onclick="runSecurityScan()">
                            <i class="fas fa-search"></i> Run Scan
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="scan-results" class="scan-container">
                            <p class="text-muted">No recent scans</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-bell"></i> Recent Alerts
                    </div>
                    <div class="card-body">
                        <div id="alerts-container" class="alerts-container">
                            <p class="text-muted">No alerts</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Network Connections -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-plug"></i> Active Network Connections
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm" id="connections-table">
                                <thead>
                                    <tr>
                                        <th>Local Address</th>
                                        <th>Remote Address</th>
                                        <th>Status</th>
                                        <th>PID</th>
                                    </tr>
                                </thead>
                                <tbody id="connections-body">
                                    <tr>
                                        <td colspan="4" class="text-muted">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
